name = "hngleam"
version = "1.0.0"
description = "A keyboard-driven Hacker News reader for the terminal"
licences = ["MIT"]
repository = { type = "github", user = "amscotti", repo = "hngleam" }
gleam = ">= 1.19.2"
target = "erlang"

[dependencies]
gleam_stdlib = ">= 1.0.5 and < 2.0.0"
shore = ">= 1.3.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"
shellout = ">= 1.8.0 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.11.0 and < 2.0.0"
birdie = ">= 2.0.2 and < 3.0.0"
simplifile = ">= 2.7.0 and < 3.0.0"
gleescript = ">= 1.5.2 and < 2.0.0"
